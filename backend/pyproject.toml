[project]
name = "knowledge-assistant"
version = "1.0.0"
description = "RAG backend: layout-aware ingestion, measured retrieval, evidence gating, cited answers."
# A hard floor, not a preference: the codebase uses PEP 604 unions (`str | None`)
# throughout, which are a syntax error on 3.9. Declared here so a deployment
# cannot silently pick an older interpreter.
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

